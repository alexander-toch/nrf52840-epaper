; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = https://github.com/maxgerhardt/platform-nordicnrf52
framework = arduino

; --- Primary target -------------------------------------------------------
; XIAO ePaper Display Board EN04 (XIAO nRF52840 Plus) driving the 7.5" UC8179
; panel via the Seeed_GFX library. Panel/board combo is set in include/driver.h.
; https://wiki.seeedstudio.com/epaper_EN04/  |  https://github.com/Seeed-Studio/Seeed_GFX
[env:xiao_epaper_en04]
board = xiaoble_adafruit
; The EN04 carries a XIAO nRF52840 *Plus*, which breaks out extra pins (D11..D19).
; Its Seeed_GFX pin map uses D11 (RST) and D16 (DC), absent from the stock XIAO
; variant's pin table, so we build against the vendored Plus variant.
board_build.variant = Seeed_XIAO_nRF52840_Plus
board_build.variants_dir = variants
monitor_speed = 9600
; -I include puts driver.h + the Seeed_Arduino_FS.h stub on the include path for
; the Seeed_GFX library TU too (not just project sources), so the library builds
; with the same BOARD_SCREEN_COMBO 502 / EN04 config as the app.
build_flags =
	-D DISPLAY_BACKEND_SEEEDGFX
	-I include
lib_deps =
	bblanchon/ArduinoJson@^7.0.3
	https://github.com/Seeed-Studio/Seeed_GFX.git
build_src_filter = +<*> -<main_mbed.cpp> -<display/display_gxepd2.cpp>

; --- Legacy targets -------------------------------------------------------
; Original hardware: XIAO nRF52840 (Sense) + Waveshare 7.5" e-Paper HAT + GxEPD2.
[env:xiaoble_arduinocore]
board = xiaoble_adafruit
monitor_speed = 9600
lib_deps =
	bblanchon/ArduinoJson@^7.0.3
	zinggjm/GxEPD2@^1.5.6
build_src_filter = +<*> -<main_mbed.cpp> -<display/display_seeedgfx.cpp>

[env:xiaoblesense_arduinocore]
board = xiaoblesense_adafruit
monitor_speed = 9600
lib_deps =
	bblanchon/ArduinoJson@^7.0.3
	zinggjm/GxEPD2@^1.5.6
build_src_filter = +<*> -<main_mbed.cpp> -<display/display_seeedgfx.cpp>

[env:xiaoblesense_arduinocore_mbed]
board = xiaoblesense
lib_deps =
	arduino-libraries/ArduinoBLE@^1.3.6
	bblanchon/ArduinoJson@^7.0.3
	zinggjm/GxEPD2@^1.5.6
build_src_filter = +<*> -<main.cpp> -<display/*>
